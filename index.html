  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: Arial, Helvetica, sans-serif;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0a0a0a;
      color: #e8d5c4;
      z-index: 2;
      transition: opacity .4s ease;
      padding: 24px;
      text-align: center;
    }
    #boot.hide {
      opacity: 0;
      pointer-events: none;
    }
    #bootLogo {
      width: min(280px, 72vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.45));
    }
    #bootTitle {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      color: #f5e6d0;
    }
    #bootSub {
      margin: 0;
      font-size: 12px;
      opacity: .7;
      max-width: 320px;
      line-height: 1.4;
    }
    #bootStatus {
      margin: 4px 0 0;
      font-size: 12px;
      color: #c4a35a;
      min-height: 1.2em;
    }
    .spin {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(196,163,90,.25);
      border-top-color: #c4a35a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0a0a;
    }

    #errorBox {
      display: none;
      max-width: 420px;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #2a1515;
      color: #f5c2c2;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }
    #errorBox code {
      display: block;
      margin-top: 8px;
      padding: 8px;
      background: #1a0a0a;
      border-radius: 6px;
      font-size: 11px;
      word-break: break-all;
      color: #f0d0a0;
    }
  </style>
</head>
